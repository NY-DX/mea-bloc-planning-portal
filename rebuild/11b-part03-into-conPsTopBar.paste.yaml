- galPsYears:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
    Properties:
      BorderThickness: =0
      FillPortions: =0
      Height: =64
      Items: =psYears
      OnSelect: |-
        =Set(psFY, ThisItem.FY);
        Set(psRecord, LookUp(psStatus, Year(Date) = psFY));
        Set(psPrev, LookUp(psStatus, Year(Date) = psFY - 1));
        Set(psRegionalOverride, Blank());
        Set(psConfirmResign, false);
        // Promotion suggests the grade one step above last year's regional grade
        Set(
            psPromoGrade,
            With(
                {pos: LookUp(ForAll(Sequence(CountRows(gradeLadder)) As s, {N: s.Value, G: Index(gradeLadder, s.Value).Value}), G = psPrev.RegionalGrade.Value).N},
                If(!IsBlank(pos) && pos < CountRows(gradeLadder), Index(gradeLadder, pos + 1).Value)
            )
        );
      TemplateFill: =If(ThisItem.FY = psFY, RGBA(212, 160, 23, 0.18), RGBA(0, 0, 0, 0.04))
      TemplatePadding: =3
      TemplateSize: =64
      Visible: =!IsBlank(psSelected)
      Width: =490
      WrapCount: =5
    Children:
      - lblPsFYText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(ThisItem.FY = psFY, uiGold, uiInk)
            FontWeight: =FontWeight.Bold
            Height: =28
            OnSelect: =Select(Parent)
            Size: =14
            Text: =Text(ThisItem.FY)
            Width: =Parent.TemplateWidth
            X: =0
            Y: =6
      - lblPsFYState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =Switch(Self.Text, "NO DATA", uiMuted, "AFTER RESIGNATION", uiMuted, "BEFORE START", uiMuted, "RESIGNS", uiGold, "OUTDATED", uiDanger, uiOk)
            FontWeight: =FontWeight.Bold
            Height: =18
            OnSelect: =Select(Parent)
            Size: =7
            Text: |-
              =With(
                  {rec: LookUp(psStatus, Year(Date) = ThisItem.FY), resignFY: lblPsResignFY.Text, startFY: lblPsStartFY.Text},
                  If(
                      !IsBlank(startFY) && ThisItem.FY < Value(startFY), "BEFORE START",
                      !IsBlank(resignFY) && ThisItem.FY > Value(resignFY), "AFTER RESIGNATION",
                      !IsBlank(rec) && rec.Resignation, "RESIGNS",
                      IsBlank(rec), "NO DATA",
                      DateDiff(rec.'Last Updated', Today(), TimeUnit.Months) > psOutdatedMonths, "OUTDATED",
                      "UP TO DATE"
                  )
              )
            Width: =Parent.TemplateWidth
            X: =0
            Y: =36
