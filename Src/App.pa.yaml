App:
  Properties:
    Formulas: |-
      =// Paste into: App > Formulas (replaces the piece 1 version).
      // White background, black panels, gold accents.
      uiBg = RGBA(255, 255, 255, 1);
      uiInk = RGBA(17, 17, 17, 1);
      uiPanel = RGBA(22, 22, 24, 1);
      uiPanelRaised = RGBA(34, 34, 37, 1);
      uiGold = RGBA(212, 160, 23, 1);
      uiGoldDim = RGBA(212, 160, 23, 0.35);
      uiWhite = RGBA(240, 240, 240, 1);
      uiMuted = RGBA(150, 150, 150, 1);
      uiDanger = RGBA(220, 70, 60, 1);
      uiOk = RGBA(90, 190, 110, 1);
      // Regional grades from lowest to highest; a promotion moves one step up.
      gradeLadder = [
          "(MEA) G1", "(MEA) G1+", "(MEA) G2", "(MEA) G2+", "(MEA) G3", "(MEA) G3+",
          "(MEA) G4M / G4P", "(MEA) M2/G5", "(MEA) M2+/G6", "(MEA) M1/G7"
      ];
    OnStart: |-
      =Set(varCurrentUserEmail, Lower(User().Email));
      Set(
          varIsGM,
          CountRows(
              Filter(
                  DepartmentTable,
                  Lower(GeneralManager.Email) = varCurrentUserEmail
              )
          ) > 0
      );

      // Fiscal year base: increments on April 1st instead of January 1st
      Set(
          varFiscalYearBase,
          If(Month(Today()) >= 4, Year(Today()), Year(Today()) - 1)
      );

      ClearCollect(
          colPlanningDates,
          ForAll(
              Sequence(5, 0),
              {
                  DateValue: Date(varFiscalYearBase + Value + 1, 4, 1),
                  DisplayYear: Text(varFiscalYearBase + Value + 1),
                  IsSelected: Value = 0
              }
          )
      )
    StartScreen: |-
      =// App  >  StartScreen
      PlanningScreen
    Theme: =PowerAppsTheme
