App:
  Properties:
    OnStart: |-
      =Set(varCurrentUserEmail, Lower(User().Email));
      Set(
          varIsGM,
          CountRows(
              Filter(
                  DepartmentTable,
                  Lower(GeneralManager.Email) = varCurrentUserEmail
              )
          ) > 0
      );

      // Fiscal year base: increments on April 1st instead of January 1st
      Set(
          varFiscalYearBase,
          If(Month(Today()) >= 4, Year(Today()), Year(Today()) - 1)
      );

      ClearCollect(
          colPlanningDates,
          ForAll(
              Sequence(5, 0),
              {
                  DateValue: Date(varFiscalYearBase + Value + 1, 4, 1),
                  DisplayYear: Text(varFiscalYearBase + Value + 1),
                  IsSelected: Value = 0
              }
          )
      )
    Theme: =PowerAppsTheme
