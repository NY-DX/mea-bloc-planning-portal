Screens:
  HomeScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// ═══════════════════════════════════════════════════════════════
        // STEP 1: GET MANAGER'S DEPARTMENTS (keep full records)
        // ═══════════════════════════════════════════════════════════════
        ClearCollect(
            colManagerDepts,
            Filter(
                DepartmentTable,
                Lower(GeneralManager.Email) = varCurrentUserEmail
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 2: DIRECT EMPLOYEES (delegable per department)
        // ═══════════════════════════════════════════════════════════════
        Clear(colDirectEmployees);
        ForAll(
            colManagerDepts As dept,
            Collect(
                colDirectEmployees,
                Filter(EmployeeTable, AddressCode.Value = dept.AddressCode)
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 3: DIRECT EMPLOYEE STATUS RECORDS (delegable per employee)
        // ═══════════════════════════════════════════════════════════════
        Clear(colDirectStatus);
        ForAll(
            colDirectEmployees As emp,
            Collect(
                colDirectStatus,
                Filter(EmployeeStatusTable, Employee.Id = emp.ID)
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 4: MOBILITY - Find status records pointing to manager's depts
        // ═══════════════════════════════════════════════════════════════
        Clear(colMobilityAssignments);
        ForAll(
            colManagerDepts As dept,
            Collect(
                colMobilityAssignments,
                Filter(EmployeeStatusTable, MobilityAC.Value = dept.AddressCode)
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 5: GET UNIQUE MOBILITY EMPLOYEE IDs (exclude direct employees)
        // ═══════════════════════════════════════════════════════════════
        ClearCollect(
            colMobilityEmployeeIds,
            Filter(
                Distinct(colMobilityAssignments, Employee.Id),
                !(Value in colDirectEmployees.ID)
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 6: GET MOBILITY EMPLOYEE RECORDS (delegable per employee)
        // ═══════════════════════════════════════════════════════════════
        Clear(colMobilityEmployees);
        ForAll(
            colMobilityEmployeeIds As mobId,
            Collect(
                colMobilityEmployees,
                LookUp(EmployeeTable, ID = mobId.Value)
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 7: GET ALL STATUS RECORDS FOR MOBILITY EMPLOYEES (all 6 years)
        // ═══════════════════════════════════════════════════════════════
        Clear(colMobilityStatus);
        ForAll(
            colMobilityEmployees As mobEmp,
            Collect(
                colMobilityStatus,
                Filter(EmployeeStatusTable, Employee.Id = mobEmp.ID)
            )
        );

        // ═══════════════════════════════════════════════════════════════
        // STEP 8: COMBINE BOTH PARTITIONS
        // ═══════════════════════════════════════════════════════════════
        ClearCollect(colManagerEmployees, colDirectEmployees);
        Collect(colManagerEmployees, colMobilityEmployees);

        ClearCollect(colEmployeeStatus, colDirectStatus);
        Collect(colEmployeeStatus, colMobilityStatus);

        // ═══════════════════════════════════════════════════════════════
        // DEBUG COUNTERS (remove after testing)
        // ═══════════════════════════════════════════════════════════════
        Set(varDebugDirect, CountRows(colDirectEmployees));
        Set(varDebugMobility, CountRows(colMobilityEmployees));
        Set(varDebugDirectStatus, CountRows(colDirectStatus));
        Set(varDebugMobilityStatus, CountRows(colMobilityStatus));
        Set(varDebugTotalEmployees, CountRows(colManagerEmployees));
        Set(varDebugTotalStatus, CountRows(colEmployeeStatus))
