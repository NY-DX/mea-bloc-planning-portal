      - ButtonCanvas5:
          Control: Button@0.0.45
          Properties:
            DisplayMode: "=If(\r\n    // Disable if required fields are blank\r\n    IsBlank(drpEmpType.Selected.Value) || \r\n    IsBlank(DataCardValue1.Selected.Value) ||\r\n    IsBlank(DataCardValue7.Selected.Value) ||\r\n    IsBlank(drpAddressCode.Selected.Value) ||\r\n    // OR if employee is on mobility AND address is NOT \"Outside\"\r\n    (varIsOnMobility && varSelectedEmployee.AddressCode.Value <> \"Outside\"),\r\n    \r\n    DisplayMode.Disabled,\r\n    DisplayMode.Edit\r\n)"
            Height: =43
            OnSelect: "=Set(\n    varExistingRecord,\n    LookUp(\n        colEmployeeStatus,\n        Employee.Id = varSelectedEmployee.ID &&\n        Date = Date(Year(radPlanningDate.Selected.Value), 4, 1)\n    )\n);\n\n// \U0001F539 Determine correct Biz/Corp based on HR Code\nSet(\n    varExpectedBizCorp,\n    Switch(\n        DataCardValue7.Selected.Value,\n        // Business HR Codes\n        \"Iron & Steel Products\", \"Business\",\n        \"Mineral & Metal Resources\", \"Business\",\n        \"Energy I\", \"Business\",\n        \"Energy II\", \"Business\",\n        \"Energy Solution\", \"Business\",\n        \"Infrastructure Projects\", \"Business\",\n        \"Mobility I\", \"Business\",\n        \"Mobility II\", \"Business\",\n        \"Basic Materials\", \"Business\",\n        \"Performance Materials\", \"Business\",\n        \"Nutrition & Agriculture\", \"Business\",\n        \"Food\", \"Business\",\n        \"Retail\", \"Business\",\n        \"Wellness\", \"Business\",\n        \"IT & Communication\", \"Business\",\n        \"Corporate Development\", \"Business\",\n        \n        // GCS HR Codes\n        \"DX\", \"GCS\",\n        \"CFO\", \"GCS\",\n        \"Legal\", \"GCS\",\n        \n        // Non-GCS HR Codes\n        \"Human Resources & General Affairs\", \"Non-GCS\",\n        \"Regional CSO\", \"Non-GCS\",\n        \n        // Default\n        \"\"\n    )\n);\n\n// \U0001F539 Check for discrepancy\nSet(\n    varHasDiscrepancy,\n    !IsBlank(varExpectedBizCorp) && \n    !IsBlank(drpEmpType.Selected.Value) &&\n    varExpectedBizCorp <> drpEmpType.Selected.Value\n);\n\n// Save current record first\nIf(\n    IsBlank(varExistingRecord),\n    // \U0001F539 INSERT new record\n    Patch(\n        EmployeeStatusTable,\n        Defaults(EmployeeStatusTable),\n        {\n            Employee: {\n                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                Id: varSelectedEmployee.ID,\n                Value: varSelectedEmployee.'FirstName ' & \" \" & varSelectedEmployee.'LastName '\n            },\n            Date: Date(Year(radPlanningDate.Selected.Value), 4, 1),\n            Title: GUID(),\n            GlobalGrade: {Value: DataCardValue8.Selected.Value},\n            RegionalGrade: {Value: DataCardValue1.Selected.Value},\n            Division: {Value: DataCardValue7.Selected.Value},\n            HQEmployment: tglHQ.Checked,\n            EmploymentType: {Value: drpEmpType.Selected.Value},\n            Promotion: tglPromotion.Checked,\n            Mobility: tglMobility.Checked,\n            MobilityRegion: If(\n                tglMobility.Checked,\n                {Value: DataCardValue10.Selected.Value},\n                {\n                    '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                    Id: -1,\n                    Value: \"\"\n                }\n            ),\n            MobilityAC: If(\n                tglMobility.Checked,\n                {\n                    '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                    Id: DataCardValue22.Selected.Id,\n                    Value: DataCardValue22.Selected.Value\n                },\n                {\n                    '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                    Id: -1,\n                    Value: \"\"\n                }\n            ),\n            Resignation: tglResignation.Checked,\n            Succession: tglSuccession.Checked,\n            AddressCode: drpAddressCode.Selected,\n            Remark: txtRemarks.Value,\n            'Last Updated': Now(),\n            FinalSubmission: DataCardValue23.Checked\n        }\n    ),\n    \n    // \U0001F504 UPDATE existing record\n    Patch(\n        EmployeeStatusTable,\n        varExistingRecord,\n        {\n            'Last Updated': Now(),\n            GlobalGrade: {Value: DataCardValue8.Selected.Value},\n            RegionalGrade: {Value: DataCardValue1.Selected.Value},\n            Division: {Value: DataCardValue7.Selected.Value},\n            HQEmployment: tglHQ.Checked,\n            EmploymentType: {Value: drpEmpType.Selected.Value},\n            Promotion: tglPromotion.Checked,\n            Mobility: tglMobility.Checked,\n            MobilityRegion: If(\n                tglMobility.Checked,\n                {Value: DataCardValue10.Selected.Value},\n                {\n                    '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                    Id: -1,\n                    Value: \"\"\n                }\n            ),\n            MobilityAC: If(\n                tglMobility.Checked,\n                {\n                    '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                    Id: DataCardValue22.Selected.Id,\n                    Value: DataCardValue22.Selected.Value\n                },\n                {\n                    '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                    Id: -1,\n                    Value: \"\"\n                }\n            ),\n            Resignation: tglResignation.Checked,\n            Succession: tglSuccession.Checked,\n            AddressCode: drpAddressCode.Selected,\n            Remark: txtRemarks.Value,\n            FinalSubmission: DataCardValue23.Checked\n        }\n    )\n);\n\n// \U0001F534 DELETE future records if Resignation is True\nIf(\n    tglResignation.Checked,\n    ForAll(\n        Filter(\n            EmployeeStatusTable,\n            Employee.Id = varSelectedEmployee.ID &&\n            Date > Date(Year(radPlanningDate.Selected.Value), 4, 1)\n        ),\n        Remove(EmployeeStatusTable, ThisRecord)\n    )\n);\n\n// ═══════════════════════════════════════════════════════════════\n// REFRESH STATUS COLLECTIONS AFTER SAVE (delegable)\n// ═══════════════════════════════════════════════════════════════\n\n// Refresh direct employee status records\nClear(colDirectStatus);\nForAll(\n    colDirectEmployees As emp,\n    Collect(\n        colDirectStatus,\n        Filter(EmployeeStatusTable, Employee.Id = emp.ID)\n    )\n);\n\n// Refresh mobility employee status records\nClear(colMobilityStatus);\nForAll(\n    colMobilityEmployees As mobEmp,\n    Collect(\n        colMobilityStatus,\n        Filter(EmployeeStatusTable, Employee.Id = mobEmp.ID)\n    )\n);\n\n// Recombine into main collection\nClearCollect(colEmployeeStatus, colDirectStatus);\nCollect(colEmployeeStatus, colMobilityStatus);\n\nResetForm(frmPlanningForm);\n\n// Refresh the current year record to show updated values\nSet(\n    varCurrentYearRecord,\n    LookUp(\n        colEmployeeStatus,\n        Employee.Id = varSelectedEmployee.ID &&\n        Date = Date(Year(radPlanningDate.Selected.Value), 4, 1)\n    )\n);\n\n// After successful save\nSet(varIsEditingResignation, false);\n\n// Update context variables with fresh data\nUpdateContext({\n    varStoredRegionalGrade: varCurrentYearRecord.RegionalGrade.Value,\n    varBaseRegionalGrade: varCurrentYearRecord.RegionalGrade.Value\n});\n\n// Reset the resignation UI state\nUpdateContext({varResignationActive: false});\n\n// TRIGGER THE GALLERY'S ONSELECT - This will load the data for the selected year\nSelect(galPlanningEmployees, galPlanningEmployees.Selected, Rectangle3);"
            Text: ="Save"
            Width: =108
            X: =1239
            Y: =693
