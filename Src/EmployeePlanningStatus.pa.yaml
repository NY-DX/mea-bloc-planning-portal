Screens:
  EmployeePlanningStatus:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =If(
            IsBlank(varSelectedEmployee),
            Set(
                varSelectedEmployee,
                First(galPlanningEmployees.AllItems)
            )
        );
    Children:
      - txtSearchPlanning:
          Control: TextInput@0.0.54
          Properties:
            Height: =34
            Placeholder: ="Search employee"
            Width: =286
            X: =24
            Y: =35
      - galPlanningEmployees:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Items: =colManagerEmployees
            OnSelect: |-
              =Set(varSelectedEmployee, ThisItem);
              Set(varTriggerRefresh, !varTriggerRefresh);
              UpdateContext({
                  varCurrentYearRecord: LookUp(
                      EmployeeStatusTable,
                      Employee.Id = ThisItem.ID And 
                      Date = Date(Value(radPlanningDate.Selected.Value), 4, 1)
                  ),
                  varPromotedGrade: Blank()
              });

              UpdateContext({
                  varHQToggleChanged: false,
                  varHQToggleState: If(!IsBlank(varCurrentYearRecord), varCurrentYearRecord.HQEmployment, false)
              });

              // --- NEW: Mobility detection ---
              Set(varManagerDepts, 
                  Filter(
                      DepartmentTable,
                      Lower(GeneralManager.Email) = Lower(varCurrentUserEmail)
                  ).AddressCode
              );

              Set(varIsOnMobility,
                  !(ThisItem.AddressCode.Value in varManagerDepts) &&
                  !IsEmpty(
                      Filter(
                          EmployeeStatusTable,
                          Employee.Value = ThisItem.'LastName ' &&
                          MobilityAC.Value in varManagerDepts
                      )
                  )
              );
            TemplateFill: |-
              =If(
                  ThisItem.ID = varSelectedEmployee.ID,
                  RGBA(0, 120, 215, 0.1),  // Light blue highlight
                  RGBA(0, 0, 0, 0)  // Transparent
              )
            Width: =279
            X: =24
            Y: =116
          Children:
            - Title3:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |+
                    =ThisItem.'FirstName ' & " " & ThisItem.'MiddleName ' & " " & ThisItem.'LastName '
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 86
                  X: =16
                  Y: =(Parent.TemplateHeight - (Self.Size*1.8 + Subtitle2.Size*1.8 + 2 + Body1.Size*1.8)) / 2
            - Subtitle2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.AddressCode.Value
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title3.Width
                  X: =Title3.X
                  Y: =Title3.Y + Title3.Height
            - Body1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title3.Width
                  X: =Title3.X
                  Y: =Subtitle2.Y + Subtitle2.Height
            - NextArrow3:
                Control: Classic/Icon@2.5.0
