      - warningHQTrue:
          Control: Text@0.0.51
          Properties:
            Height: =77
            Text: ="Are you sure the relevant staff is HQ employment staff?"
            Visible: |-
              =varHQToggleChanged And
              varHQToggleState = true And
              Coalesce(
                  varCurrentYearRecord.HQEmployment,
                  LookUp(
                      EmployeeStatusTable,
                      Employee.Id = galPlanningEmployees.Selected.ID And 
                      Date = Date(Value(radPlanningDate.Selected.Value) - 1, 4, 1)
                  ).HQEmployment,
                  false
              ) = false
            Width: =195
            X: =456
            Y: =307
      - warningHQFalse:
          Control: Text@0.0.51
          Properties:
            Height: =77
            Text: ="Please input the non-HQ staff in the remarks section and specify who will be the successor"
            Visible: |-
              =varHQToggleChanged And
              varHQToggleState = false And
              Coalesce(
                  varCurrentYearRecord.HQEmployment,
                  LookUp(
                      EmployeeStatusTable,
                      Employee.Id = galPlanningEmployees.Selected.ID And 
                      Date = Date(Value(radPlanningDate.Selected.Value) - 1, 4, 1)
                  ).HQEmployment,
                  false
              ) = true
            Width: =195
            X: =456
            Y: =307
      - lblDebug:
          Control: Text@0.0.51
          Properties:
            Height: =30
            Text: |-
              ="Direct Emp: " & varDebugDirect & 
              " | Mobility Emp: " & varDebugMobility & 
              " | Total Emp: " & varDebugTotalEmployees &
              " | Direct Status: " & varDebugDirectStatus &
              " | Mobility Status: " & varDebugMobilityStatus &
              " | Total Status: " & varDebugTotalStatus
            Width: =647
            X: =310
            Y: =736
