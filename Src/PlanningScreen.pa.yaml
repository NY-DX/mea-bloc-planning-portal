                                                      "(MEA) M2/G5", "GG2", "(MEA) M2+/G6", "GG2",
                                                      "(MEA) M1/G7", "GG1",
                                                      "—"
                                                  )
                                    - fldPsPromotion:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                        Children:
                                          - lblPsPromotionCap:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiMuted
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =9
                                                Text: ="PROMOTION THIS YEAR"
                                          - tglPsPromotion:
                                              Control: Toggle@1.1.5
                                              Properties:
                                                AccessibleLabel: ="Promotion"
                                                Checked: =Coalesce(psRecord.Promotion, false)
                                                DisplayMode: =If(psLocked, DisplayMode.View, DisplayMode.Edit)
                                                Height: =36
                                                Label: =If(Self.Checked, "Yes", "No")
                                                OnCheck: |-
                                                  =If(
                                                      Self.Checked <> Coalesce(psRecord.Promotion, false),
                                                      Set(psRegionalOverride, With(
                                                          {pos: LookUp(ForAll(Sequence(CountRows(gradeLadder)) As s, {N: s.Value, G: Index(gradeLadder, s.Value).Value}), G = cmbPsRegional.Selected.Value).N},
                                                          If(IsBlank(pos), Blank(), Index(gradeLadder, Min(pos + 1, CountRows(gradeLadder))).Value)
                                                      )),
                                                      Set(psRegionalOverride, Blank())
                                                  )
                                                OnUncheck: |-
                                                  =If(
                                                      Self.Checked <> Coalesce(psRecord.Promotion, false),
                                                      Set(psRegionalOverride, With(
                                                          {pos: LookUp(ForAll(Sequence(CountRows(gradeLadder)) As s, {N: s.Value, G: Index(gradeLadder, s.Value).Value}), G = cmbPsRegional.Selected.Value).N},
                                                          If(IsBlank(pos), Blank(), Index(gradeLadder, Max(pos - 1, 1)).Value)
                                                      )),
                                                      Set(psRegionalOverride, Blank())
