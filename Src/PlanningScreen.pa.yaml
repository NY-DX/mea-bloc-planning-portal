Screens:
  PlanningScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// PlanningScreen.OnVisible (replaces the piece 7 version).
        // Everything this screen creates is prefixed "ps", so it never depends on the old screens.
        // Fiscal years start on 1 April. Planning covers the next five fiscal years.
        Set(psFiscalBase, If(Month(Today()) >= 4, Year(Today()), Year(Today()) - 1));
        ClearCollect(
            psYears,
            ForAll(
                Sequence(5, 1) As n,
                {FY: psFiscalBase + n.Value, StartDate: Date(psFiscalBase + n.Value, 4, 1)}
            )
        );
        If(IsBlank(psFY) || !(psFY in psYears.FY), Set(psFY, First(psYears).FY));
        // A record is "outdated" when it was last updated more than this many months ago.
        Set(psOutdatedMonths, 10);
        // The current General Manager's departments
        Set(psUserEmail, Lower(User().Email));
        ClearCollect(
            psDepts,
            Filter(DepartmentTable, Lower(GeneralManager.Email) = psUserEmail)
        );
        // Direct employees and planned hires: home address code is one of the GM's departments
        Clear(psEmployees);
        ForAll(
            psDepts As dept,
            Collect(
                psEmployees,
                ForAll(
                    Filter(EmployeeTable, AddressCode.Value = dept.AddressCode) As emp,
                    {
                        ID: emp.ID,
                        FullName: Trim(emp.'FirstName ' & " " & emp.'MiddleName ' & " " & emp.'LastName '),
                        AddressCode: emp.AddressCode.Value,
                        EmployeeNo: emp.'Employee ID',
                        Kind: If(emp.PlannedHire, "Planned", "Direct")
                    }
                )
            )
        );
        // Mobility employees: a status record (any year) assigns them to one of the GM's departments.
        // Matched by employee ID (the old screen matched by last name).
        Clear(psMobilityIds);
        ForAll(
            psDepts As dept,
            Collect(
                psMobilityIds,
                ForAll(
                    Filter(EmployeeStatusTable, MobilityAC.Value = dept.AddressCode) As st,
                    {EmpId: st.Employee.Id}
                )
            )
        );
        ForAll(
            Filter(Distinct(psMobilityIds, EmpId), !(Value in psEmployees.ID)) As mob,
            With(
                {emp: LookUp(EmployeeTable, ID = mob.Value)},
                If(
                    !IsBlank(emp),
                    Collect(
                        psEmployees,
                        {
                            ID: emp.ID,
                            FullName: Trim(emp.'FirstName ' & " " & emp.'MiddleName ' & " " & emp.'LastName '),
                            AddressCode: emp.AddressCode.Value,
                            EmployeeNo: emp.'Employee ID',
                            Kind: "Mobility"
                        }
                    )
                )
            )
        );
        // Keep the selection only if that employee is still in the list, and reload their records
        If(!(psSelected.ID in psEmployees.ID), Set(psSelected, Blank()));
        If(
            IsBlank(psSelected),
            Clear(psStatus),
            ClearCollect(psStatus, Filter(EmployeeStatusTable, Employee.Value = Text(psSelected.ID)))
        );
        // Mobility employees are read-only unless their home address code is "Outside" (same rule as before)
        Set(psLocked, !IsBlank(psSelected) && psSelected.Kind = "Mobility" && psSelected.AddressCode <> "Outside");
        // The record shown in the form, and the previous year's record used to pre-fill a new one
        Set(psRecord, LookUp(psStatus, Year(Date) = psFY));
        Set(psPrev, LookUp(psStatus, Year(Date) = psFY - 1));
        Set(psRegionalOverride, Blank());
        Set(psConfirmResign, false);
        // Promotion suggests the grade one step above last year's regional grade
        Set(
            psPromoGrade,
            With(
                {pos: LookUp(ForAll(Sequence(CountRows(gradeLadder)) As s, {N: s.Value, G: Index(gradeLadder, s.Value).Value}), G = psPrev.RegionalGrade.Value).N},
                If(!IsBlank(pos) && pos < CountRows(gradeLadder), Index(gradeLadder, pos + 1).Value)
            )
        );
        Set(psConfirmRemove, false);
        Set(psShowHire, false);
        Set(psShowOverview, false);
    Children:
      - conPlanRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =uiBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conPlanHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =uiBg
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMinHeight: =64
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - lblPlanAccent:
                      Control: Label@2.5.1
                      Properties:
                        Fill: =uiGold
                        Height: =32
                        Text: =""
                        Width: =6
                  - lblPlanTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =uiGold
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="PERSONNEL PLANNING"
                  - lblPlanUser:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =uiMuted
                        Size: =11
                        Text: =Upper(User().FullName)
                        Width: =320
            - lblPlanHeaderLine:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =uiGold
                  Height: =2
                  Text: =""
            - conPlanBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =uiBg
                  LayoutDirection: =LayoutDirection.Horizontal
                Children:
                  - conPlanSidebar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =uiBg
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinWidth: =320
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Width: =320
                      Children:
                        - lblSideTitle:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =uiGold
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =12
                              Text: ="EMPLOYEES"
                        - txtPsSearch:
                            Control: TextInput@0.0.54
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =34
                              Placeholder: ="Search name or employee ID"
                        - lblPsCount:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =uiMuted
                              Height: =18
                              Size: =9
                              Text: =CountRows(galPsEmployees.AllItems) & " of " & CountRows(psEmployees) & " employees"
                        - galPsEmployees:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                            Properties:
                              Items: |-
                                =Sort(
                                    Filter(
                                        psEmployees,
                                        IsBlank(txtPsSearch.Value) ||
                                        txtPsSearch.Value in FullName ||
                                        txtPsSearch.Value in EmployeeNo
                                    ),
                                    Kind & "|" & FullName
                                )
                              OnSelect: |-
                                =// galPsEmployees  >  OnSelect
                                Set(psSelected, ThisItem);
                                Set(psLocked, ThisItem.Kind = "Mobility" && ThisItem.AddressCode <> "Outside");
                                Set(psConfirmRemove, false);
                                ClearCollect(psStatus, Filter(EmployeeStatusTable, Employee.Value = Text(ThisItem.ID)));
                                Set(psRecord, LookUp(psStatus, Year(Date) = psFY));
                                Set(psPrev, LookUp(psStatus, Year(Date) = psFY - 1));
                                Set(psRegionalOverride, Blank());
                                Set(psConfirmResign, false);
                                // Promotion suggests the grade one step above last year's regional grade
                                Set(
                                    psPromoGrade,
                                    With(
                                        {pos: LookUp(ForAll(Sequence(CountRows(gradeLadder)) As s, {N: s.Value, G: Index(gradeLadder, s.Value).Value}), G = psPrev.RegionalGrade.Value).N},
                                        If(!IsBlank(pos) && pos < CountRows(gradeLadder), Index(gradeLadder, pos + 1).Value)
                                    )
                                );
                              TemplateFill: =If(ThisItem.ID = psSelected.ID, RGBA(212, 160, 23, 0.15), RGBA(0, 0, 0, 0))
                              TemplateSize: =60
                            Children:
                              - lblPsEmpBar:
                                  Control: Label@2.5.1
                                  Properties:
                                    Fill: =uiGold
                                    Height: =Parent.TemplateHeight - 16
                                    OnSelect: =Select(Parent)
                                    Text: =""
                                    Visible: =ThisItem.ID = psSelected.ID
                                    Width: =4
                                    Y: =8
                              - lblPsEmpName:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =uiInk
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =ThisItem.FullName
                                    Width: =Parent.TemplateWidth - 24
                                    X: =14
                                    Y: =8
                              - lblPsEmpSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =uiMuted
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =9
                                    Text: =ThisItem.AddressCode & "  ·  " & ThisItem.EmployeeNo
                                    Width: =Parent.TemplateWidth - 110
                                    X: =14
                                    Y: =32
                              - lblPsEmpTag:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =uiGold
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =8
                                    Text: =Switch(ThisItem.Kind, "Mobility", "MOBILITY", "Planned", "PLANNED HIRE", "")
                                    Width: =80
                                    X: =Parent.TemplateWidth - 92
                                    Y: =32
                              - lblPsEmpLine:
                                  Control: Label@2.5.1
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0.08)
                                    Height: =1
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                        - lblPsAddHire:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =uiGold
                              BorderThickness: =1
                              Color: =uiGold
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              OnSelect: |-
                                =Reset(txtPsHireName);
                                Set(psShowHire, true)
                              Size: =10
                              Text: ="+  ADD PLANNED HIRE"
                  - lblSideDivider:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =uiGold
                        Text: =""
                        Width: =2
                  - conPlanMain:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =uiBg
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        PaddingBottom: =24
                        PaddingLeft: =32
                        PaddingRight: =32
                        PaddingTop: =24
                      Children:
                        - lblMainTitle:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =uiInk
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: =If(IsBlank(psSelected), "SELECT AN EMPLOYEE", Upper(psSelected.FullName))
                        - lblMainPlaceholder:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =uiMuted
                              Height: =24
                              Size: =12
                              Text: |-
                                =If(
                                    IsBlank(psSelected),
                                    "Pick someone from the list on the left.",
                                    psSelected.AddressCode & "  ·  " & psSelected.EmployeeNo &
                                    If(psSelected.Kind = "Mobility", "  ·  Mobility (assigned to one of your departments)", "")
                                )
                              VerticalAlign: =VerticalAlign.Top
                        - conPsYearBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =72
                              Visible: =!IsBlank(psSelected)
                            Children:
                              - lblPsYearCaption:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =uiMuted
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =10
                                    Text: ="PLANNING YEAR"
                                    Width: =120
                              - galPsYears:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                                  Properties:
                                    FillPortions: =0
                                    Height: =64
                                    Items: =psYears
                                    OnSelect: |+
                                      =// galPsYears  >  OnSelect
                                      Set(psFY, ThisItem.FY);
                                      Set(psRecord, LookUp(psStatus, Year(Date) = psFY));
                                      Set(psPrev, LookUp(psStatus, Year(Date) = psFY - 1));
                                      Set(psRegionalOverride, Blank());
                                      Set(psConfirmResign, false);
                                      // Promotion suggests the grade one step above last year's regional grade
                                      Set(
                                          psPromoGrade,
                                          With(
                                              {pos: LookUp(ForAll(Sequence(CountRows(gradeLadder)) As s, {N: s.Value, G: Index(gradeLadder, s.Value).Value}), G = psPrev.RegionalGrade.Value).N},
                                              If(!IsBlank(pos) && pos < CountRows(gradeLadder), Index(gradeLadder, pos + 1).Value)
                                          )
                                      )
                                    TemplateFill: =If(ThisItem.FY = psFY, RGBA(212, 160, 23, 0.18), RGBA(0, 0, 0, 0.04))
                                    TemplatePadding: =4
                                    TemplateSize: =64
                                    Width: =650
                                    WrapCount: =5
                                  Children:
                                    - lblPsFYText:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(ThisItem.FY = psFY, uiGold, uiInk)
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          Size: =14
                                          Text: =Text(ThisItem.FY)
                                          Width: =Parent.TemplateWidth
                                          Y: =6
                                    - lblPsFYState:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =Switch(Self.Text, "NO DATA", uiMuted, "OUTDATED", uiDanger, uiOk)
                                          FontWeight: =FontWeight.Bold
                                          Height: =18
                                          OnSelect: =Select(Parent)
                                          Size: =8
                                          Text: |-
                                            =With(
                                                {rec: LookUp(psStatus, Year(Date) = ThisItem.FY)},
                                                If(
                                                    IsBlank(rec), "NO DATA",
                                                    DateDiff(rec.'Last Updated', Today(), TimeUnit.Months) > psOutdatedMonths, "OUTDATED",
                                                    "UP TO DATE"
                                                )
                                            )
                                          Width: =Parent.TemplateWidth
                                          Y: =36
                              - lblPsRemoveHire:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =uiDanger
                                    BorderThickness: =1
                                    Color: =uiDanger
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    OnSelect: |-
                                      =// lblPsRemoveHire  >  OnSelect
                                      If(
                                          !psConfirmRemove,
                                          Set(psConfirmRemove, true),
                                          Set(psConfirmRemove, false);
                                          Set(psHireError, "");
                                          IfError(
                                              Remove(EmployeeStatusTable, psStatus);
                                              Remove(EmployeeTable, LookUp(EmployeeTable, ID = psSelected.ID));
                                              true,
                                              Set(psHireError, FirstError.Message)
                                          );
                                          If(
                                              IsBlank(psHireError),
                                              Notify("Removed planned hire " & psSelected.FullName & ".", NotificationType.Success);
                                              RemoveIf(psEmployees, ID = psSelected.ID);
                                              Set(psSelected, Blank());
                                              Clear(psStatus),
                                              Notify("Could not remove: " & psHireError, NotificationType.Error)
                                          )
                                      )
                                    Size: =9
                                    Text: =If(psConfirmRemove, "CLICK AGAIN TO REMOVE", "REMOVE PLANNED HIRE")
                                    Visible: =psSelected.Kind = "Planned"
                                    Width: =190
                              - lblPsStartFY_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      =// Fiscal year in which a planned hire starts (blank for real employees)
                                      If(psSelected.Kind = "Planned" && StartsWith(psSelected.EmployeeNo, "TBH FY"), Right(psSelected.EmployeeNo, 4), "")
                                    Visible: =false
                                    Width: =0
                        - conPsForm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              Visible: =!IsBlank(psSelected)
                            Children:
                              - lblPsRecordInfo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =uiMuted
                                    Height: =22
                                    Size: =10
                                    Text: |-
                                      =If(
                                          IsBlank(psRecord),
                                          "FY" & psFY & " has no saved record yet" &
                                              If(IsBlank(psPrev), ".", ", so the fields are pre-filled from FY" & (psFY - 1) & "."),
                                          "FY" & psFY & " saved record, last updated " & Text(psRecord.'Last Updated', "dd mmm yyyy")
                                      ) & If(psLocked, "  Read-only: mobility employee managed by their home department.", "")
                              - lblPsSecPosition:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =uiGold
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    Size: =10
                                    Text: ="POSITION"
                              - conPsRowPosition:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =64
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =24
                                    LayoutMinHeight: =64
                                  Children:
                                    - fldPsBizCorp:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                        Children:
                                          - lblPsBizCorpCap:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiMuted
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =9
                                                Text: ="BIZ / CORP"
                                          - cmbPsBizCorp:
                                              Control: ComboBox@0.0.51
                                              Properties:
                                                AccessibleLabel: ="Biz/Corp"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DefaultSelectedItems: =Filter(Choices([@EmployeeStatusTable].EmploymentType), Value = Coalesce(psRecord.EmploymentType.Value, psPrev.EmploymentType.Value))
                                                DisplayMode: =If(psLocked, DisplayMode.View, DisplayMode.Edit)
                                                Height: =36
                                                Items: =Choices([@EmployeeStatusTable].EmploymentType)
                                    - fldPsHRCode:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                        Children:
                                          - lblPsHRCodeCap:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiMuted
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =9
                                                Text: ="HR CODE"
                                          - cmbPsHRCode:
                                              Control: ComboBox@0.0.51
                                              Properties:
                                                AccessibleLabel: ="HR Code"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DefaultSelectedItems: =Filter(Choices([@EmployeeStatusTable].Division), Value = Coalesce(psRecord.Division.Value, psPrev.Division.Value))
                                                DisplayMode: =If(psLocked, DisplayMode.View, DisplayMode.Edit)
                                                Height: =36
                                                Items: =Choices([@EmployeeStatusTable].Division)
                                    - fldPsAddress:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                        Children:
                                          - lblPsAddressCap:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiMuted
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =9
                                                Text: ="ADDRESS CODE"
                                          - cmbPsAddress:
                                              Control: ComboBox@0.0.51
                                              Properties:
                                                AccessibleLabel: ="Address Code"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DefaultSelectedItems: =Filter(Choices([@EmployeeStatusTable].AddressCode), Value = Coalesce(psRecord.AddressCode.Value, psPrev.AddressCode.Value))
                                                DisplayMode: =If(psLocked, DisplayMode.View, DisplayMode.Edit)
                                                Height: =36
                                                Items: =Choices([@EmployeeStatusTable].AddressCode)
                              - lblPsSecGrade:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =uiGold
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    Size: =10
                                    Text: ="GRADE"
                              - conPsRowGrade:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =64
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =24
                                    LayoutMinHeight: =64
                                  Children:
                                    - fldPsRegional:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                        Children:
                                          - lblPsRegionalCap:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiMuted
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =9
                                                Text: ="REGIONAL GRADE"
                                          - cmbPsRegional:
                                              Control: ComboBox@0.0.51
                                              Properties:
                                                AccessibleLabel: ="Regional Grade"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DefaultSelectedItems: |-
                                                  =// cmbPsRegional  >  DefaultSelectedItems   (the APPLY link can override it)
                                                  Filter(
                                                      Choices([@EmployeeStatusTable].RegionalGrade),
                                                      Value = Coalesce(psRegionalOverride, psRecord.RegionalGrade.Value, psPrev.RegionalGrade.Value)
                                                  )
                                                DisplayMode: =If(psLocked, DisplayMode.View, DisplayMode.Edit)
                                                Height: =36
                                                Items: =Choices([@EmployeeStatusTable].RegionalGrade)
                                    - fldPsGlobal:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                        Children:
                                          - lblPsGlobalCap:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiMuted
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                Size: =9
                                                Text: ="GLOBAL GRADE (FROM REGIONAL)"
                                          - lblPsGlobalValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =uiInk
                                                Fill: =RGBA(0, 0, 0, 0.04)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =36
                                                PaddingLeft: =10
                                                Size: =12
                                                Text: |-
                                                  =Switch(
                                                      cmbPsRegional.Selected.Value,
                                                      "(MEA) E", "N/A",
                                                      "(MEA) G1", "GG5", "(MEA) G1+", "GG5", "(MEA) G2", "GG5", "(MEA) G2+", "GG5",
                                                      "(MEA) G3", "GG4", "(MEA) G3+", "GG4",
