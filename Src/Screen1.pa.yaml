Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - SampleContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - SampleTitle:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  FontWeight: =FontWeight.Bold
                  LayoutMinWidth: =Parent.Width
                  Size: =24
                  Text: ="Sample screen"
                  Width: =Parent.Width
            - SampleDescription:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  LayoutMinWidth: =Parent.Width
                  Size: =16
                  Text: ="This screen was created from pasted YAML."
                  Width: =Parent.Width
            - SampleBackButton:
                Control: Button@0.0.45
                Properties:
                  OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
                  Text: ="Back to home"
                  Width: =200
