      - btnSubmit:
          Control: Button@0.0.45
          Properties:
            DisplayMode: |-
              =If(
                  IsBlank(drpDivisionP.Selected.Value) || 
                  IsBlank(DataCardValue2.Selected.Value) ||
                  IsBlank(drpEmpTypeP.Selected.Value)
                  ,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Height: =47
            OnSelect: "=// ============================================\r\n// FINAL WORKING VERSION - MULTI-YEAR SUBMISSION\r\n// ============================================\r\n\r\n// \U0001F539 Determine correct Biz/Corp based on HR Code\r\nSet(\r\n    varExpectedBizCorp,\r\n    Switch(\r\n        drpDivisionP.Selected.Value,\r\n        // Business HR Codes\r\n        \"Iron & Steel Products\", \"Business\",\r\n        \"Mineral & Metal Resources\", \"Business\",\r\n        \"Energy I\", \"Business\",\r\n        \"Energy II\", \"Business\",\r\n        \"Energy Solution\", \"Business\",\r\n        \"Infrastructure Projects\", \"Business\",\r\n        \"Mobility I\", \"Business\",\r\n        \"Mobility II\", \"Business\",\r\n        \"Basic Materials\", \"Business\",\r\n        \"Performance Materials\", \"Business\",\r\n        \"Nutrition & Agriculture\", \"Business\",\r\n        \"Food\", \"Business\",\r\n        \"Retail\", \"Business\",\r\n        \"Wellness\", \"Business\",\r\n        \"IT & Communication\", \"Business\",\r\n        \"Corporate Development\", \"Business\",\r\n        \r\n        // GCS HR Codes\r\n        \"DX\", \"GCS\",\r\n        \"CFO\", \"GCS\",\r\n        \"Legal\", \"GCS\",\r\n        \r\n        // Non-GCS HR Codes\r\n        \"Human Resources & General Affairs\", \"Non-GCS\",\r\n        \"Regional CSO\", \"Non-GCS\",\r\n        \r\n        // Default\r\n        \"\"\r\n    )\r\n);\r\n\r\n// \U0001F539 Check for discrepancy\r\nSet(\r\n    varHasDiscrepancy,\r\n    !IsBlank(varExpectedBizCorp) && \r\n    !IsBlank(drpEmpTypeP.Selected.Value) &&\r\n    varExpectedBizCorp <> drpEmpTypeP.Selected.Value\r\n);\r\n\r\n// Step 1: Capture all form values in variables\r\nSet(varSelectedDeptID, varSelectedDepartment.ID);\r\nSet(varSelectedDeptCode, varSelectedDepartment.AddressCode);\r\n\r\n// Step 2: Create collection of years to save\r\nClearCollect(\r\n    colYearsToSave,\r\n    // Always include the selected year\r\n    {Year: Value(radPlanningDateP.Selected.Value)}\r\n);\r\n\r\n// Add additional years based on checkbox selections\r\nIf(chkYear1.Visible && chkYear1.Checked, \r\n    Collect(colYearsToSave, {Year: varFiscalYearBase + 2})\r\n);\r\nIf(chkYear2.Visible && chkYear2.Checked, \r\n    Collect(colYearsToSave, {Year: varFiscalYearBase + 3})\r\n);\r\nIf(chkYear3.Visible && chkYear3.Checked, \r\n    Collect(colYearsToSave, {Year: varFiscalYearBase + 4})\r\n);\r\nIf(chkYear4.Visible && chkYear4.Checked, \r\n    Collect(colYearsToSave, {Year: varFiscalYearBase + 5})\r\n);\r\n\r\n\r\n// Step 3: Create records for each selected year\r\nForAll(\r\n    colYearsToSave,\r\n    Patch(\r\n        DepartmentStatusTable,\r\n        Defaults(DepartmentStatusTable),\r\n        {\r\n            AddressCode: {\r\n                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\r\n                Id: varSelectedDeptID,\r\n                Value: varSelectedDeptCode\r\n            },\r\n            Date: Date(Year, 4, 1),\r\n            Recruitment: txtRecruitment.Value,\r\n            GlobalGrade: {Value: drpGradeP.Selected.Value},\r\n            RegionalGrade: {Value: DataCardValue2.Selected.Value},\r\n            HQEmployment: tglHQP.Checked,\r\n            Mobility: tglMobility.Checked,\r\n            EmploymentType: {Value: drpEmpTypeP.Selected.Value},\r\n            Division: {Value: drpDivisionP.Selected.Value},\r\n            Title: GUID(),\r\n            // Discrepancy: varHasDiscrepancy,\r\n            'Last Updated': Now()\r\n        }\r\n    )\r\n);\r\n\r\n// Step 4: Show success notification with details\r\nNotify(\r\n    \"Successfully created \" & CountRows(colYearsToSave) & \" record(s) for years: \" & \r\n    Concat(colYearsToSave, Text(Year), \", \"),\r\n    NotificationType.Success,\r\n    4000\r\n);\r\n\r\n// Step 5: Reset checkboxes after submission\r\nReset(chkYear1);\r\nReset(chkYear2);\r\nReset(chkYear3);\r\nReset(chkYear4);\r\n\r\n// Step 6: Clear the collection\r\nClear(colYearsToSave);"
            Text: ="Submit"
            Width: =113
            X: =1223
            Y: =665
